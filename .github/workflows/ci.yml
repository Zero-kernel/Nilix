name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# CI only needs to read the checked-out source. Keep the default GITHUB_TOKEN
# fail-closed instead of granting repository write scopes to test jobs.
permissions:
  contents: read

jobs:
  fmt-clippy:
    name: rustfmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-08
          components: rustfmt, clippy, rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: make fmt-check
      - name: cargo clippy
        run: make clippy

  build:
    name: build (bootloader + kernel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-08
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      - name: make build
        run: make build

  lint:
    name: custom lints (grep gates + ABI oracle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: make lint
        run: make lint
      # Explicit steps so a future selective-target refactor of `lint` cannot
      # silently drop these gates (they also run inside `make lint`). ubuntu-latest
      # ships python3 + gcc, so the lint job stays checkout-only.
      - name: make lint-fallible (VFS fallibility gate, explicit)
        run: make lint-fallible
      - name: make abi-check (ABI layout oracle — Rust source vs Linux x86-64 reference)
        run: make abi-check

  hosted-subcrate-tests:
    name: hosted kernel submodule tests (169 + compile checks, default-parallel)
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_TARGET: x86_64-unknown-linux-gnu
      CARGO_TARGET_DIR: hosted-subcrate-target
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-08
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hosted-subcrate-tests
          workspaces: ". -> hosted-subcrate-target"
      - name: make test-hosted-subcrates (count-pinned; Rust default parallelism)
        run: make test-hosted-subcrates

  boot:
    name: boot-check + test + musl-check (QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-12-08
          components: rust-src, llvm-tools-preview
          targets: x86_64-unknown-none, x86_64-unknown-uefi
      - uses: Swatinem/rust-cache@v2
      - name: Install QEMU + OVMF + musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf musl-tools
      - name: make boot-check (boots the kernel, asserts 0 NX-violation #PF)
        run: make boot-check
      - name: make test (runtime suite gate; Test Summary + panic/NX; exit 0/1/2)
        run: make test
      - name: make musl-check (static-musl conformance gate)
        run: make musl-check

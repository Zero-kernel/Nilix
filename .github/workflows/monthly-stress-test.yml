name: Monthly Stress Test

on:
  schedule:
    # Run at 2:00 AM UTC on the last day of every month
    - cron: '0 2 28-31 * *'
  workflow_dispatch:  # Allow manual trigger

permissions: {}

jobs:
  check-last-day:
    runs-on: ubuntu-latest
    outputs:
      is-last-day: ${{ steps.check.outputs.is-last-day }}
    steps:
      - name: Check if today is the last day of the month
        id: check
        run: |
          TODAY=$(date +%d)
          TOMORROW=$(date -d tomorrow +%d)
          if [ "$TOMORROW" = "01" ]; then
            echo "is-last-day=true" >> $GITHUB_OUTPUT
          else
            echo "is-last-day=false" >> $GITHUB_OUTPUT
          fi

  stress-test:
    needs: check-last-day
    if: needs.check-last-day.outputs.is-last-day == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate stress test runner
        run: |
          test -r scripts/stress_test.sh
          bash -n scripts/stress_test.sh
          bash scripts/stress_test_test.sh

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-12-08
          components: rust-src, llvm-tools-preview

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf e2fsprogs musl-tools

      - name: Build isolated Ring-3 stress kernel and I/O image
        run: |
          make build-stress
          make ensure-ext3-image
        env:
          OVMF_PATH: /usr/share/OVMF/OVMF_CODE.fd

      - name: Run standard Ring-3 stress workload (60s per profile)
        id: stress-standard
        run: |
          STRESS_DURATION=60 STRESS_CPUS=4 bash scripts/stress_test.sh esp-stress
        env:
          OVMF_PATH: /usr/share/OVMF/OVMF_CODE.fd

      - name: Run extended Ring-3 stress workload (300s per profile)
        id: stress-extended
        if: steps.stress-standard.outcome == 'success'
        run: |
          STRESS_DURATION=300 STRESS_CPUS=4 bash scripts/stress_test.sh esp-stress
        env:
          OVMF_PATH: /usr/share/OVMF/OVMF_CODE.fd

      - name: Create stress test report
        if: always()
        env:
          STANDARD_OUTCOME: ${{ steps.stress-standard.outcome }}
          EXTENDED_OUTCOME: ${{ steps.stress-extended.outcome }}
        run: |
          status_label() {
            case "$1" in
              success) printf 'PASS' ;;
              failure) printf 'FAIL' ;;
              skipped) printf 'SKIPPED' ;;
              cancelled) printf 'CANCELLED' ;;
              *) printf 'NOT RUN' ;;
            esac
          }

          generated_at="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          standard_outcome="${STANDARD_OUTCOME:-not-run}"
          extended_outcome="${EXTENDED_OUTCOME:-not-run}"
          standard_label="$(status_label "$standard_outcome")"
          extended_label="$(status_label "$extended_outcome")"

          {
            printf '# Monthly Stress Test Report\n\n'
            printf '**Date:** %s\n' "$generated_at"
            printf '**Commit:** %s\n' "$GITHUB_SHA"
            printf '**Branch:** %s\n\n' "$GITHUB_REF_NAME"
            printf '## Results\n\n'
            printf '### Standard Ring-3 Stress Workload (60s per profile)\n'
            printf 'Status: %s (%s)\n\n' "$standard_label" "$standard_outcome"
            printf '### Extended Ring-3 Stress Workload (300s per profile)\n'
            printf 'Status: %s (%s)\n\n' "$extended_label" "$extended_outcome"
            printf '## Summary\n\n'
            printf -- '- Standard Test: %s\n' "$standard_label"
            printf -- '- Extended Test: %s\n\n' "$extended_label"
            printf 'See workflow logs for detailed output.\n'
          } > stress-report.md

      - name: Upload stress test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-test-report-${{ github.run_number }}
          path: stress-report.md
          retention-days: 90

  notify-failure:
    needs: stress-test
    if: always() && needs.stress-test.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Comment on commit
        uses: actions/github-script@v9
        with:
          script: |
            const message = `## Monthly Stress Test Failed

            The monthly stress test job failed.

            - **Commit:** ${{ github.sha }}
            - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please review the job logs and uploaded stress report.`;

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: message
            });

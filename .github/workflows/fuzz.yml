name: Comprehensive Kernel Fuzzing

on:
  # Scheduled runs - every 6 hours for continuous fuzzing, daily for cargo-fuzz
  schedule:
    - cron: '0 */6 * * *'  # Continuous KCOV fuzzing every 6 hours
    - cron: '0 2 * * *'    # Cargo-fuzz targets daily at 2 AM UTC

  # Manual trigger
  workflow_dispatch:
    inputs:
      mode:
        description: 'Fuzzing mode'
        required: true
        default: 'continuous'
        type: choice
        options:
          - continuous  # KCOV-based continuous fuzzing
          - targets     # Cargo-fuzz libFuzzer targets
          - both        # Run both modes
      duration:
        description: 'Duration in hours (continuous mode)'
        required: false
        default: '6'
      timeout:
        description: 'Timeout per target in seconds (targets mode)'
        required: false
        default: '600'
      workers:
        description: 'Number of parallel workers (continuous mode)'
        required: false
        default: '4'

  # Trigger on kernel changes
  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'userspace/fuzzer/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'

jobs:
  # Job 1: Kernel fuzzer via make test-fuzz
  kernel-fuzz:
    name: Kernel Fuzzer (KCOV-based)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'continuous' || github.event.inputs.mode == 'both') ||
      github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-08
          components: rust-src

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf build-essential

      - name: Build kernel with KCOV
        run: |
          if grep -q "test-fuzz" Makefile; then
            make test-fuzz || echo "Fuzzer test completed"
          else
            echo "No test-fuzz target found, building kernel normally"
            make build || make kernel
          fi

      - name: Check for crashes in QEMU output
        if: always()
        run: |
          if [ -f serial.log ]; then
            echo "=== QEMU Serial Output ==="
            cat serial.log

            # Check for panics or crashes
            if grep -i "panic\|crash\|ERROR" serial.log; then
              echo "::warning::Potential crashes detected in kernel fuzzer"
            fi
          else
            echo "No serial.log found"
          fi

      - name: Upload serial logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-fuzz-serial-log
          path: serial.log
          retention-days: 7
          if-no-files-found: ignore

  # Job 2: Cargo-fuzz libFuzzer targets
  cargo-fuzz-targets:
    name: Cargo-Fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'targets' || github.event.inputs.mode == 'both')

    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_syscall
          - fuzz_vfs_path
          - fuzz_signal_delivery
          - fuzz_memory_ops
          - fuzz_ipc_message
          - fuzz_scheduler
          - fuzz_network_packet
          - fuzz_cgroup_ops
          - fuzz_elf_loader
          - fuzz_futex_ops

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.sha }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Run fuzzer
        run: |
          cd fuzz
          timeout=${{ github.event.inputs.timeout || '600' }}
          echo "Running ${{ matrix.target }} for ${timeout}s"

          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=${timeout} \
            -rss_limit_mb=4096 \
            -print_final_stats=1 \
            2>&1 | tee fuzz_output_${{ matrix.target }}.txt \
            || exit_code=$?

          # Exit code 0 = success, 77 = timeout (ok), others = crash
          if [ ${exit_code:-0} -ne 0 ] && [ ${exit_code:-0} -ne 77 ]; then
            echo "::warning::Fuzzer found issues in ${{ matrix.target }}"
          fi
        continue-on-error: true
        id: fuzz

      - name: Check for crashes
        if: always()
        id: check_crashes
        run: |
          cd fuzz
          crashes=$(find artifacts/${{ matrix.target }} -name 'crash-*' 2>/dev/null | wc -l || echo 0)
          echo "crashes=${crashes}" >> $GITHUB_OUTPUT
          if [ "$crashes" -gt 0 ]; then
            echo "::warning::Found $crashes crash(es) in ${{ matrix.target }}"
            ls -lh artifacts/${{ matrix.target }}/crash-* || true
          fi

      - name: Upload crash artifacts
        if: always() && steps.check_crashes.outputs.crashes > 0
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-crashes-${{ matrix.target }}
          path: |
            fuzz/artifacts/${{ matrix.target }}/crash-*
            fuzz/artifacts/${{ matrix.target }}/timeout-*
            fuzz/artifacts/${{ matrix.target }}/oom-*
          retention-days: 30

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-corpus-${{ matrix.target }}
          path: fuzz/corpus/${{ matrix.target }}/
          retention-days: 7

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-fuzz-output-${{ matrix.target }}
          path: fuzz/fuzz_output_${{ matrix.target }}.txt
          retention-days: 7

  # Job 3: Summary report
  summary:
    name: Fuzzing Summary
    runs-on: ubuntu-latest
    needs: [kernel-fuzz, cargo-fuzz-targets]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Generate summary
        run: |
          echo "# Fuzzing Report" > summary.md
          echo "" >> summary.md
          echo "**Run:** ${{ github.run_id }}" >> summary.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> summary.md
          echo "" >> summary.md

          # Check for kernel fuzzer logs
          echo "## Kernel Fuzzer (KCOV)" >> summary.md
          if [ -f artifacts/kernel-fuzz-serial-log/serial.log ]; then
            if grep -qi "panic\|crash\|ERROR" artifacts/kernel-fuzz-serial-log/serial.log; then
              echo "⚠️ Issues detected - see serial log artifact" >> summary.md
            else
              echo "✓ Completed without panics" >> summary.md
            fi
          else
            echo "No output available" >> summary.md
          fi
          echo "" >> summary.md

          # Check for cargo-fuzz crashes
          echo "## Cargo-Fuzz Targets" >> summary.md
          echo "" >> summary.md

          crash_count=0
          for dir in artifacts/cargo-fuzz-crashes-*; do
            if [ -d "$dir" ]; then
              target=$(basename "$dir" | sed 's/cargo-fuzz-crashes-//')
              crashes=$(find "$dir" -type f | wc -l)
              crash_count=$((crash_count + crashes))
              echo "- **$target**: $crashes crash(es)" >> summary.md
            fi
          done

          if [ "$crash_count" -eq 0 ]; then
            echo "✓ No crashes found across all targets" >> summary.md
          else
            echo "" >> summary.md
            echo "**Total crashes:** $crash_count" >> summary.md
          fi

          cat summary.md

      - name: Add to step summary
        if: always()
        run: cat summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-summary
          path: summary.md
          retention-days: 30

name: Fuzzing

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      timeout:
        description: Seconds per target (1-1200)
        type: string
        default: '900'

permissions: {}
concurrency:
  group: fuzz-${{ github.run_id }}
  cancel-in-progress: false

# Required tool/feature and real guest smoke checks live in CI. This workflow
# owns private campaigns only; its reporting keeps the existing opaque IDs.
jobs:
  fuzz-tools-test:
    name: Campaign prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-kernel
        with:
          cache-key: host-tools
      - run: bash scripts/ci/entrypoint.sh tools
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-prerequisites
          path: target/ci/tools/
          if-no-files-found: error

  cargo-fuzz-targets:
    name: Cargo-Fuzz ${{ matrix.target }}
    needs: fuzz-tools-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_syscall, fuzz_vfs_path, fuzz_signal_delivery, fuzz_memory_ops, fuzz_ipc_message, fuzz_scheduler, fuzz_network_packet, fuzz_cgroup_ops, fuzz_elf_loader, fuzz_futex_ops, fuzz_syscall_qemu]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-08
          components: rust-src

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target/
            userspace/fuzzer/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock', 'userspace/fuzzer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # Install QEMU and musl-tools for the fuzz_syscall_qemu target
      - name: Install QEMU and build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 musl-tools age

      - name: Verify private evidence encryption
        env:
          FUZZ_EVIDENCE_RECIPIENTS: ${{ vars.FUZZ_EVIDENCE_RECIPIENTS }}
        run: python3 scripts/fuzz/private_evidence.py preflight

      # Build before any secret is present so dependency build scripts never
      # inherit the private fingerprinting key.
      - name: Build candidate triage tool
        run: cargo build --locked --release --manifest-path userspace/fuzzer/Cargo.toml --bin crash-triage --target x86_64-unknown-linux-gnu

      # Build QEMU fuzzer dependencies (KCOV kernel + executor) for fuzz_syscall_qemu
      - name: Build QEMU fuzzer dependencies
        if: matrix.target == 'fuzz_syscall_qemu'
        run: make build-fuzz-qemu-deps

      - name: Restore corpus
        id: restore_corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Prepare fuzz directories
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}

      # Raw libFuzzer output can include Base64 reproducers and stack traces.
      # Keep plaintext in RUNNER_TEMP. Upload only the sealed age archive.
      - name: Run fuzzer privately
        id: run_fuzzer
        env:
          FUZZ_TIMEOUT: ${{ inputs.timeout || '900' }}
        run: |
          python3 scripts/fuzz/private_evidence.py run \
            --private-dir "$RUNNER_TEMP/nilix-fuzz-evidence" \
            --target "${{ matrix.target }}" --timeout "$FUZZ_TIMEOUT"

      - name: Count private findings
        if: always()
        id: count_findings
        run: |
          findings=$(find "$RUNNER_TEMP/nilix-fuzz-evidence/findings" -maxdepth 1 -type f \
            \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) \
            2>/dev/null | wc -l)
          echo "findings=${findings}" >> "$GITHUB_OUTPUT"

      - name: Validate fuzzer outcome
        if: always()
        id: validate_fuzzer
        env:
          FUZZ_EXIT_CODE: ${{ steps.run_fuzzer.outputs.exit_code }}
          FUZZ_FINDINGS: ${{ steps.count_findings.outputs.findings }}
        run: |
          if ! [[ "$FUZZ_EXIT_CODE" =~ ^[0-9]+$ ]] || ! [[ "$FUZZ_FINDINGS" =~ ^[0-9]+$ ]]; then
            echo "::error::Fuzzer did not produce valid private result metadata"
            exit 1
          fi
          if [ "$FUZZ_EXIT_CODE" -ne 0 ] && [ "$FUZZ_FINDINGS" -eq 0 ]; then
            echo "::error::Fuzzer failed without producing a private finding"
            exit 1
          fi

      # A stable repository secret makes the public ID opaque even for tiny
      # inputs. If it is absent, findings fail closed and no artifact is sent.
      - name: Create opaque candidate metadata
        if: steps.count_findings.outputs.findings > 0
        id: create_candidates
        env:
          NILIX_FUZZ_FINGERPRINT_KEY: ${{ secrets.FUZZ_FINGERPRINT_KEY }}
          FUZZ_FINDINGS: ${{ steps.count_findings.outputs.findings }}
        run: |
          if [ "${#NILIX_FUZZ_FINGERPRINT_KEY}" -lt 32 ]; then
            echo "::error::Private fuzz candidate fingerprinting is not configured"
            exit 1
          fi

          umask 077
          input_root="$RUNNER_TEMP/nilix-fuzz-evidence/finding-input"
          input_dir="$input_root/cargo-fuzz-crashes-${{ matrix.target }}"
          candidate_dir="fuzz/candidates"
          private_triage_log="$RUNNER_TEMP/nilix-fuzz-evidence/triage.log"
          mkdir -p "$input_dir" "$candidate_dir"
          if ! find "$RUNNER_TEMP/nilix-fuzz-evidence/findings" -maxdepth 1 -type f \
            \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) \
            -exec cp -- {} "$input_dir/" \; \
            > /dev/null 2> "$private_triage_log"; then
            echo "::error::Failed to stage a private fuzz candidate"
            exit 1
          fi

          if ! userspace/fuzzer/target/x86_64-unknown-linux-gnu/release/crash-triage \
            --crash-dir "$input_root" \
            --output-dir "$candidate_dir" \
            --private-index "$RUNNER_TEMP/nilix-fuzz-evidence/candidate-index.json" \
            --expected-findings "$FUZZ_FINDINGS" \
            --dedup \
            >> "$private_triage_log" 2>&1; then
            echo "::error::Private fuzz candidate triage failed"
            exit 1
          fi

          candidate_count=$(find "$candidate_dir" -maxdepth 1 -type f -name 'candidate-*.txt' | wc -l)
          if [ "$candidate_count" -eq 0 ]; then
            echo "::error::Private findings produced no opaque candidate metadata"
            exit 1
          fi
          echo "candidate_count=${candidate_count}" >> "$GITHUB_OUTPUT"

      - name: Upload opaque candidate metadata
        if: steps.create_candidates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-candidates-${{ strategy.job-index }}
          path: fuzz/candidates/candidate-*.txt
          retention-days: 90
          if-no-files-found: error

      # Preserve evidence even when the fuzzer/triage failed without a candidate.
      # A missing recipient, seal failure or upload failure makes the campaign
      # incomplete and prevents the reporting job from creating an empty pointer.
      - name: Seal private campaign evidence
        id: seal_evidence
        if: always() && steps.run_fuzzer.outcome != 'skipped'
        env:
          FUZZ_EVIDENCE_RECIPIENTS: ${{ vars.FUZZ_EVIDENCE_RECIPIENTS }}
        run: |
          python3 scripts/fuzz/private_evidence.py seal \
            --private-dir "$RUNNER_TEMP/nilix-fuzz-evidence" \
            --output fuzz/evidence/campaign.tar.gz.age

      - name: Upload encrypted campaign evidence
        id: upload_evidence
        if: always() && steps.seal_evidence.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-evidence-${{ strategy.job-index }}
          path: fuzz/evidence/campaign.tar.gz.age
          retention-days: 90
          if-no-files-found: error

      - name: Save clean corpus
        if: steps.validate_fuzzer.outcome == 'success' && steps.count_findings.outputs.findings == '0' && steps.upload_evidence.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write public result manifest
        if: always() && !cancelled()
        id: write_result
        env:
          RUN_OUTCOME: ${{ steps.run_fuzzer.outcome }}
          COUNT_OUTCOME: ${{ steps.count_findings.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_fuzzer.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.create_candidates.outcome }}
          SEAL_OUTCOME: ${{ steps.seal_evidence.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
          FINDINGS: ${{ steps.count_findings.outputs.findings }}
          CANDIDATE_COUNT: ${{ steps.create_candidates.outputs.candidate_count }}
        run: |
          status=completed
          candidate_count=0
          if [ "$RUN_OUTCOME" != "success" ] || [ "$COUNT_OUTCOME" != "success" ] || [ "$VALIDATE_OUTCOME" != "success" ] || [ "$SEAL_OUTCOME" != "success" ] || [ "$EVIDENCE_UPLOAD_OUTCOME" != "success" ]; then
            status=incomplete
          elif ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then
            status=incomplete
          elif [ "$FINDINGS" -gt 0 ]; then
            if [ "$CANDIDATE_OUTCOME" != "success" ] || ! [[ "$CANDIDATE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              status=incomplete
            else
              candidate_count="$CANDIDATE_COUNT"
            fi
          fi
          printf 'Schema: nilix-fuzz-result-v1\nStatus: %s\nCandidate-Count: %s\n' \
            "$status" "$candidate_count" > fuzz-result.txt

      - name: Upload public result manifest
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-result-${{ strategy.job-index }}
          path: fuzz-result.txt
          retention-days: 30
          if-no-files-found: error

  candidate-reporting:
    name: Report Opaque Fuzz Candidates
    needs: cargo-fuzz-targets
    if: ${{ !cancelled() && needs.cargo-fuzz-targets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: nilix-fuzz-candidate-reporting
      cancel-in-progress: false

    steps:
      - name: Download opaque candidate metadata
        uses: actions/download-artifact@v8
        with:
          path: candidates/
          pattern: 'fuzz-candidates-*'

      - name: Validate candidate metadata
        id: candidates
        run: |
          mkdir -p candidates
          candidate_count=0
          while IFS= read -r -d '' candidate_file; do
            schema=$(grep -m1 -oP '^Schema: \K.*' "$candidate_file" || true)
            candidate_id=$(grep -m1 -oP '^Candidate-ID: \K.*' "$candidate_file" || true)
            line_count=$(wc -l < "$candidate_file")
            if [ "$schema" != "nilix-fuzz-candidate-v1" ] || \
               ! [[ "$candidate_id" =~ ^hmac-sha256:[0-9a-f]{64}$ ]] || \
               [ "$line_count" -ne 2 ]; then
              echo "::error::Rejected malformed public candidate metadata"
              exit 1
            fi
            candidate_count=$((candidate_count + 1))
          done < <(find candidates -type f -name 'candidate-*.txt' -print0)
          echo "candidate_count=${candidate_count}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse public security pointers
        if: steps.candidates.outputs.candidate_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          matches_file="$RUNNER_TEMP/fuzz-candidate-issue-matches.tsv"
          private_query_log="$RUNNER_TEMP/fuzz-candidate-issue-query.log"
          while IFS= read -r -d '' candidate_file; do
            candidate_id=$(grep -m1 -oP '^Candidate-ID: \K.*' "$candidate_file")
            marker="<!-- nilix-fuzz-candidate-id:${candidate_id} -->"
            if ! gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/issues?state=all&per_page=100" \
              --jq ".[] | select(.pull_request == null) | select((.body // \"\") | contains(\"${marker}\")) | [.number, (.state | ascii_upcase)] | @tsv" \
              > "$matches_file" 2> "$private_query_log"; then
              echo "::error::Failed to query existing fuzz candidate pointers"
              exit 1
            fi
            mapfile -t matches < "$matches_file"

            if [ "${#matches[@]}" -gt 0 ]; then
              IFS=$'\t' read -r issue_number issue_state <<< "${matches[0]}"
              if [ "$issue_state" = "CLOSED" ]; then
                gh issue reopen "$issue_number"
              fi
              gh issue comment "$issue_number" \
                --body "The opaque candidate was observed again in [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) at head ${{ github.sha }}. Encrypted evidence is retained in the run's fuzz-evidence artifacts; details remain private under SECURITY.md."
              continue
            fi

            issue_body="Automated fuzzing observed a private candidate in [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Encrypted evidence is retained in the run's fuzz-evidence artifacts. Plaintext security details and the reproducer are not public. Maintainers should decrypt the archive and inspect candidate-index.json and guest outcome.json before classifying the finding under SECURITY.md. Opaque candidate ID: ${candidate_id}."
            issue_body+=$'\n\n'
            issue_body+="$marker"
            gh issue create \
              --title "[Fuzzing]: private candidate from run ${{ github.run_id }}" \
              --body "$issue_body" \
              --label "bug"
          done < <(find candidates -type f -name 'candidate-*.txt' -print0)

  aggregate-report:
    name: Fuzzing result
    needs: [fuzz-tools-test, cargo-fuzz-targets, candidate-reporting]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: fuzz-result-*
          path: artifacts
      - run: python3 scripts/ci/ci_report.py artifacts --fuzz --expected-manifests 11
        if: always()
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fuzz-summary
          path: artifacts/summary.md
          retention-days: 30
          if-no-files-found: error

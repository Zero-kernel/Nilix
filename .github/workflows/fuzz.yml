name: Comprehensive Kernel Fuzzing

on:
  schedule:
    - cron: '0 2 * * 0'    # Weekly KCOV build and pipeline smoke
    - cron: '0 2 * * *'    # Daily cargo-fuzz targets

  workflow_dispatch:
    inputs:
      mode:
        description: 'Fuzzing mode'
        required: true
        default: 'targets'
        type: choice
        options:
          - targets  # Cargo-fuzz libFuzzer targets
          - smoke    # KCOV build + CI plumbing smoke (no fuzz evidence)
          - both     # Run targets and the smoke job
      timeout:
        description: 'Seconds per cargo-fuzz target (1-1200)'
        required: false
        default: '600'

  push:
    branches:
      - main
    paths:
      - 'kernel/**'
      - 'userspace/fuzzer/**'
      - 'fuzz/**'
      - '.github/workflows/fuzz.yml'

permissions: {}

jobs:
  fuzz-tools-test:
    name: Fuzz Tool Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-08
          components: clippy

      - name: Cache fuzz-tool build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            userspace/fuzzer/target/
          key: ${{ runner.os }}-fuzz-tools-${{ hashFiles('userspace/fuzzer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-tools-

      - name: Test fuzz tools
        run: cargo test --locked --manifest-path userspace/fuzzer/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu

      - name: Lint fuzz tools
        run: cargo clippy --locked --manifest-path userspace/fuzzer/Cargo.toml --all-targets --target x86_64-unknown-linux-gnu -- -D warnings

  # This job validates the KCOV build and CI plumbing. It executes no fuzz
  # input and cannot produce candidate metadata or crash artifacts.
  fuzz-pipeline-smoke:
    name: KCOV Build and Fuzz-Pipeline Smoke
    needs: fuzz-tools-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * 0' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'smoke' || github.event.inputs.mode == 'both')

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-08
          components: rust-src

      - name: Install QEMU and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf build-essential

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-kcov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-kcov-

      - name: Build KCOV-instrumented kernel
        run: |
          make build-kcov
          test -f esp-kcov/kernel.elf

      - name: Build fuzz-pipeline smoke simulator
        run: cargo build --locked --release --manifest-path userspace/fuzzer/Cargo.toml --bin fuzz-pipeline-smoke --target x86_64-unknown-linux-gnu

      - name: Run fuzz-pipeline smoke simulator
        id: run_smoke
        run: |
          mkdir -p fuzz-smoke-dashboard
          set +e
          userspace/fuzzer/target/x86_64-unknown-linux-gnu/release/fuzz-pipeline-smoke \
            --dashboard-dir fuzz-smoke-dashboard \
            --worker-id 1 \
            --max-iterations 1000 \
            --iteration-delay-ms 1 \
            --report-interval 1 \
            > fuzz-smoke.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -ne 0 ]; then
            echo "::error::Fuzz-pipeline smoke failed"
            exit "$exit_code"
          fi

      - name: Validate smoke output allowlist
        run: |
          actual=$(find fuzz-smoke-dashboard -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=$(printf 'dashboard.html\ndashboard.json')
          if [ "$actual" != "$expected" ]; then
            echo "::error::Smoke simulator produced an unexpected output file"
            exit 1
          fi
          grep -q '"mode": "simulator"' fuzz-smoke-dashboard/dashboard.json
          grep -q '"kernel_executions": 0' fuzz-smoke-dashboard/dashboard.json

      - name: Upload smoke dashboard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-dashboard
          path: |
            fuzz-smoke-dashboard/dashboard.html
            fuzz-smoke-dashboard/dashboard.json
          retention-days: 30
          if-no-files-found: error

      - name: Upload smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-log
          path: fuzz-smoke.log
          retention-days: 7
          if-no-files-found: error

  cargo-fuzz-targets:
    name: Cargo-Fuzz ${{ matrix.target }}
    needs: fuzz-tools-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    if: |
      github.event_name == 'schedule' && github.event.schedule == '0 2 * * *' ||
      github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'targets' || github.event.inputs.mode == 'both') ||
      github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        # Pushes use the three host-safe targets that call real kernel parser
        # code. Scheduled/manual runs retain the complete target set.
        target: ${{ fromJSON(github.event_name == 'push' && '["fuzz_vfs_path","fuzz_network_packet","fuzz_elf_loader"]' || '["fuzz_syscall","fuzz_vfs_path","fuzz_signal_delivery","fuzz_memory_ops","fuzz_ipc_message","fuzz_scheduler","fuzz_network_packet","fuzz_cgroup_ops","fuzz_elf_loader","fuzz_futex_ops"]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2025-12-08
          components: rust-src

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target/
            userspace/fuzzer/target/
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('fuzz/Cargo.lock', 'userspace/fuzzer/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked

      # Build before any secret is present so dependency build scripts never
      # inherit the private fingerprinting key.
      - name: Build candidate triage tool
        run: cargo build --locked --release --manifest-path userspace/fuzzer/Cargo.toml --bin crash-triage --target x86_64-unknown-linux-gnu

      - name: Restore corpus
        id: restore_corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Prepare fuzz directories
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          mkdir -p fuzz/artifacts/${{ matrix.target }}

      # Raw libFuzzer output can include Base64 reproducers and stack traces.
      # Keep it only in RUNNER_TEMP; never tee, cat, summarize, or upload it.
      - name: Run fuzzer privately
        id: run_fuzzer
        env:
          FUZZ_TIMEOUT: ${{ github.event_name == 'push' && '60' || github.event.inputs.timeout || '600' }}
        run: |
          timeout="$FUZZ_TIMEOUT"
          if ! [[ "$timeout" =~ ^[1-9][0-9]*$ ]] || [ "$timeout" -gt 1200 ]; then
            echo "::error::Fuzz timeout must be an integer from 1 through 1200"
            exit 1
          fi

          private_log="$RUNNER_TEMP/libfuzzer-output.log"
          set +e
          cargo +nightly-2025-12-08 fuzz run ${{ matrix.target }} -- \
            -max_total_time="$timeout" \
            -rss_limit_mb=4096 \
            -print_final_stats=1 \
            > "$private_log" 2>&1
          exit_code=$?
          set -e
          echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"

      - name: Count private findings
        if: always()
        id: count_findings
        run: |
          findings=$(find fuzz/artifacts/${{ matrix.target }} -maxdepth 1 -type f \
            \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) \
            2>/dev/null | wc -l)
          echo "findings=${findings}" >> "$GITHUB_OUTPUT"

      - name: Validate fuzzer outcome
        if: always()
        id: validate_fuzzer
        env:
          FUZZ_EXIT_CODE: ${{ steps.run_fuzzer.outputs.exit_code }}
          FUZZ_FINDINGS: ${{ steps.count_findings.outputs.findings }}
        run: |
          if ! [[ "$FUZZ_EXIT_CODE" =~ ^[0-9]+$ ]] || ! [[ "$FUZZ_FINDINGS" =~ ^[0-9]+$ ]]; then
            echo "::error::Fuzzer did not produce valid private result metadata"
            exit 1
          fi
          if [ "$FUZZ_EXIT_CODE" -ne 0 ] && [ "$FUZZ_FINDINGS" -eq 0 ]; then
            echo "::error::Fuzzer failed without producing a private finding"
            exit 1
          fi

      # A stable repository secret makes the public ID opaque even for tiny
      # inputs. If it is absent, findings fail closed and no artifact is sent.
      - name: Create opaque candidate metadata
        if: steps.count_findings.outputs.findings > 0
        id: create_candidates
        env:
          NILIX_FUZZ_FINGERPRINT_KEY: ${{ secrets.FUZZ_FINGERPRINT_KEY }}
          FUZZ_FINDINGS: ${{ steps.count_findings.outputs.findings }}
        run: |
          if [ "${#NILIX_FUZZ_FINGERPRINT_KEY}" -lt 32 ]; then
            echo "::error::Private fuzz candidate fingerprinting is not configured"
            exit 1
          fi

          input_root="$RUNNER_TEMP/nilix-finding-input"
          input_dir="$input_root/cargo-fuzz-crashes-${{ matrix.target }}"
          candidate_dir="fuzz/candidates"
          private_triage_log="$RUNNER_TEMP/candidate-triage.log"
          mkdir -p "$input_dir" "$candidate_dir"
          if ! find fuzz/artifacts/${{ matrix.target }} -maxdepth 1 -type f \
            \( -name 'crash-*' -o -name 'timeout-*' -o -name 'oom-*' -o -name 'leak-*' \) \
            -exec cp -- {} "$input_dir/" \; \
            > /dev/null 2> "$private_triage_log"; then
            echo "::error::Failed to stage a private fuzz candidate"
            exit 1
          fi

          if ! userspace/fuzzer/target/x86_64-unknown-linux-gnu/release/crash-triage \
            --crash-dir "$input_root" \
            --output-dir "$candidate_dir" \
            --expected-findings "$FUZZ_FINDINGS" \
            --dedup \
            >> "$private_triage_log" 2>&1; then
            echo "::error::Private fuzz candidate triage failed"
            exit 1
          fi

          candidate_count=$(find "$candidate_dir" -maxdepth 1 -type f -name 'candidate-*.txt' | wc -l)
          if [ "$candidate_count" -eq 0 ]; then
            echo "::error::Private findings produced no opaque candidate metadata"
            exit 1
          fi
          echo "candidate_count=${candidate_count}" >> "$GITHUB_OUTPUT"

      - name: Upload opaque candidate metadata
        if: steps.create_candidates.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-candidates-${{ strategy.job-index }}
          path: fuzz/candidates/candidate-*.txt
          retention-days: 90
          if-no-files-found: error

      - name: Save clean corpus
        if: steps.validate_fuzzer.outcome == 'success' && steps.count_findings.outputs.findings == '0'
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}/
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Write public result manifest
        if: always() && !cancelled()
        id: write_result
        env:
          RUN_OUTCOME: ${{ steps.run_fuzzer.outcome }}
          COUNT_OUTCOME: ${{ steps.count_findings.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_fuzzer.outcome }}
          CANDIDATE_OUTCOME: ${{ steps.create_candidates.outcome }}
          FINDINGS: ${{ steps.count_findings.outputs.findings }}
          CANDIDATE_COUNT: ${{ steps.create_candidates.outputs.candidate_count }}
        run: |
          status=completed
          candidate_count=0
          if [ "$RUN_OUTCOME" != "success" ] || [ "$COUNT_OUTCOME" != "success" ] || [ "$VALIDATE_OUTCOME" != "success" ]; then
            status=incomplete
          elif ! [[ "$FINDINGS" =~ ^[0-9]+$ ]]; then
            status=incomplete
          elif [ "$FINDINGS" -gt 0 ]; then
            if [ "$CANDIDATE_OUTCOME" != "success" ] || ! [[ "$CANDIDATE_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              status=incomplete
            else
              candidate_count="$CANDIDATE_COUNT"
            fi
          fi
          printf 'Schema: nilix-fuzz-result-v1\nStatus: %s\nCandidate-Count: %s\n' \
            "$status" "$candidate_count" > fuzz-result.txt

      - name: Upload public result manifest
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-result-${{ strategy.job-index }}
          path: fuzz-result.txt
          retention-days: 30
          if-no-files-found: error

  candidate-reporting:
    name: Report Opaque Fuzz Candidates
    needs: cargo-fuzz-targets
    if: ${{ !cancelled() && needs.cargo-fuzz-targets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    concurrency:
      group: nilix-fuzz-candidate-reporting
      cancel-in-progress: false

    steps:
      - name: Download opaque candidate metadata
        uses: actions/download-artifact@v8
        with:
          path: candidates/
          pattern: 'fuzz-candidates-*'

      - name: Validate candidate metadata
        id: candidates
        run: |
          mkdir -p candidates
          candidate_count=0
          while IFS= read -r -d '' candidate_file; do
            schema=$(grep -m1 -oP '^Schema: \K.*' "$candidate_file" || true)
            candidate_id=$(grep -m1 -oP '^Candidate-ID: \K.*' "$candidate_file" || true)
            line_count=$(wc -l < "$candidate_file")
            if [ "$schema" != "nilix-fuzz-candidate-v1" ] || \
               ! [[ "$candidate_id" =~ ^hmac-sha256:[0-9a-f]{64}$ ]] || \
               [ "$line_count" -ne 2 ]; then
              echo "::error::Rejected malformed public candidate metadata"
              exit 1
            fi
            candidate_count=$((candidate_count + 1))
          done < <(find candidates -type f -name 'candidate-*.txt' -print0)
          echo "candidate_count=${candidate_count}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse public security pointers
        if: steps.candidates.outputs.candidate_count > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          matches_file="$RUNNER_TEMP/fuzz-candidate-issue-matches.tsv"
          private_query_log="$RUNNER_TEMP/fuzz-candidate-issue-query.log"
          while IFS= read -r -d '' candidate_file; do
            candidate_id=$(grep -m1 -oP '^Candidate-ID: \K.*' "$candidate_file")
            marker="<!-- nilix-fuzz-candidate-id:${candidate_id} -->"
            if ! gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GH_REPO}/issues?state=all&per_page=100" \
              --jq ".[] | select(.pull_request == null) | select((.body // \"\") | contains(\"${marker}\")) | [.number, (.state | ascii_upcase)] | @tsv" \
              > "$matches_file" 2> "$private_query_log"; then
              echo "::error::Failed to query existing fuzz candidate pointers"
              exit 1
            fi
            mapfile -t matches < "$matches_file"

            if [ "${#matches[@]}" -gt 0 ]; then
              IFS=$'\t' read -r issue_number issue_state <<< "${matches[0]}"
              if [ "$issue_state" = "CLOSED" ]; then
                gh issue reopen "$issue_number"
                gh issue comment "$issue_number" \
                  --body "The opaque candidate was observed again in [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Details remain private under SECURITY.md."
              else
                echo "Opaque candidate is already tracked by #${issue_number}"
              fi
              continue
            fi

            issue_body="Automated fuzzing observed a private candidate in [workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Potential security details and the reproducer were not written to public logs or artifacts. Maintainers should coordinate under SECURITY.md. Opaque candidate ID: ${candidate_id}."
            issue_body+=$'\n\n'
            issue_body+="$marker"
            gh issue create \
              --title "[Fuzzing]: private candidate from run ${{ github.run_id }}" \
              --body "$issue_body" \
              --label "bug"
          done < <(find candidates -type f -name 'candidate-*.txt' -print0)

  aggregate-report:
    name: Aggregate Report
    needs: [fuzz-tools-test, fuzz-pipeline-smoke, cargo-fuzz-targets, candidate-reporting]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Download public artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Generate aggregate report
        env:
          TOOLS_RESULT: ${{ needs.fuzz-tools-test.result }}
          SMOKE_RESULT: ${{ needs.fuzz-pipeline-smoke.result }}
          CARGO_RESULT: ${{ needs.cargo-fuzz-targets.result }}
          REPORTING_RESULT: ${{ needs.candidate-reporting.result }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_MODE: ${{ github.event.inputs.mode }}
        run: |
          expected_targets=0
          if [ "$EVENT_NAME" = "push" ]; then
            expected_targets=3
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$EVENT_SCHEDULE" = "0 2 * * *" ]; then
            expected_targets=10
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && { [ "$DISPATCH_MODE" = "targets" ] || [ "$DISPATCH_MODE" = "both" ]; }; then
            expected_targets=10
          fi

          {
            echo "# Comprehensive Fuzzing Report"
            echo
            echo "**Run:** ${{ github.run_id }}"
            echo "**Commit:** ${{ github.sha }}"
            echo "**Trigger:** ${{ github.event_name }}"
            echo
            echo "## Job status"
            echo
            echo "- Fuzz tool tests: $TOOLS_RESULT"
            echo "- KCOV/pipeline smoke: $SMOKE_RESULT"
            echo "- Cargo-fuzz matrix: $CARGO_RESULT"
            echo "- Opaque candidate reporting: $REPORTING_RESULT"
            echo
          } > aggregate-report.md

          if [ "$expected_targets" -eq 0 ]; then
            echo "## Cargo-fuzz targets" >> aggregate-report.md
            echo "" >> aggregate-report.md
            echo "Not requested for this run." >> aggregate-report.md
          elif [ "$CARGO_RESULT" != "success" ]; then
            echo "## Cargo-fuzz targets: INCOMPLETE" >> aggregate-report.md
            echo "" >> aggregate-report.md
            echo "The matrix did not complete successfully; no clean result is claimed." >> aggregate-report.md
          else
            mapfile -t result_files < <(find artifacts -type f -name 'fuzz-result.txt' | sort)
            completed_results=0
            candidate_count=0
            malformed=0
            for result_file in "${result_files[@]}"; do
              schema=$(grep -m1 -oP '^Schema: \K.*' "$result_file" || true)
              status=$(grep -m1 -oP '^Status: \K.*' "$result_file" || true)
              count=$(grep -m1 -oP '^Candidate-Count: \K.*' "$result_file" || true)
              if [ "$schema" != "nilix-fuzz-result-v1" ] || ! [[ "$count" =~ ^[0-9]+$ ]]; then
                malformed=1
                continue
              fi
              if [ "$status" = "completed" ]; then
                completed_results=$((completed_results + 1))
              else
                malformed=1
              fi
              candidate_count=$((candidate_count + count))
            done

            if [ "${#result_files[@]}" -ne "$expected_targets" ] || \
               [ "$completed_results" -ne "$expected_targets" ] || \
               [ "$malformed" -ne 0 ] || \
               [ "$REPORTING_RESULT" != "success" ]; then
              echo "## Cargo-fuzz targets: INCOMPLETE" >> aggregate-report.md
              echo "" >> aggregate-report.md
              echo "Expected $expected_targets complete result manifests; no clean result is claimed." >> aggregate-report.md
            elif [ "$candidate_count" -gt 0 ]; then
              echo "## Cargo-fuzz targets: PRIVATE CANDIDATES OBSERVED" >> aggregate-report.md
              echo "" >> aggregate-report.md
              echo "$candidate_count opaque candidate(s) were routed through SECURITY.md without public reproducers." >> aggregate-report.md
            else
              echo "## Cargo-fuzz targets: COMPLETE" >> aggregate-report.md
              echo "" >> aggregate-report.md
              echo "No findings were observed by the selected targets." >> aggregate-report.md
            fi
          fi

          echo "" >> aggregate-report.md
          echo "Raw fuzzer output, findings, and corpora are never uploaded as public artifacts." >> aggregate-report.md
          cat aggregate-report.md

      - name: Add to step summary
        if: always()
        run: cat aggregate-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: aggregate-report
          path: aggregate-report.md
          retention-days: 90
          if-no-files-found: error

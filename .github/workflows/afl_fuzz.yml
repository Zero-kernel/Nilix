name: AFL++ Kernel Fuzzing

# NOTE: This workflow is preserved but disabled because AFL++ QEMU mode
# cannot fuzz the bare-metal Nilix kernel (x86_64-unknown-none).
# See docs/fuzz/AFL_STATUS.md for alternatives (userspace wrappers or libFuzzer).
#
# To enable after adapting this to a supported userspace target, set the
# repository Actions variable ENABLE_AFL_QEMU=true. It is absent by default.

on:
  schedule:
    - cron: '0 3 * * 0'  # Weekly on Sunday at 3 AM UTC
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration in hours'
        required: false
        default: '24'
      instances:
        description: 'Number of parallel fuzzer instances'
        required: false
        default: '4'

permissions:
  contents: read

jobs:
  afl-fuzz:
    if: vars.ENABLE_AFL_QEMU == 'true'
    name: AFL++ Full-Kernel Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 1500  # 25 hours max

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install AFL++
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev automake cmake git flex bison libglib2.0-dev libpixman-1-dev python3-setuptools cargo libgtk-3-dev
          git clone https://github.com/AFLplusplus/AFLplusplus
          cd AFLplusplus
          make
          cd qemu_mode
          ./build_qemu_support.sh
          cd ..
          sudo make install

      - name: Verify AFL++ installation
        run: |
          afl-fuzz -h
          afl-qemu-trace -h

      - name: Build kernel
        run: |
          cd kernel
          cargo +nightly build \
            --release \
            --target x86_64-unknown-none \
            -Z build-std=core,alloc \
            -Z build-std-features=compiler-builtins-mem

      - name: Generate seed corpus
        run: |
          chmod +x scripts/generate_afl_seeds.sh
          ./scripts/generate_afl_seeds.sh

      - name: Run AFL++ fuzzer
        run: |
          duration_hours=${{ github.event.inputs.duration || '24' }}
          duration_seconds=$((duration_hours * 3600))
          instances=${{ github.event.inputs.instances || '4' }}

          chmod +x scripts/afl_parallel.sh

          # Run in background with timeout
          timeout ${duration_seconds}s ./scripts/afl_parallel.sh \
            --kernel target/x86_64-unknown-none/release/kernel \
            --instances $instances \
            --timeout 10000 \
            --memory 2G \
            || true  # Timeout is expected

      - name: Collect results
        if: always()
        run: |
          # Generate summary
          if command -v afl-whatsup &> /dev/null; then
            afl-whatsup fuzz/afl_findings > afl_summary.txt || true
          fi

          # Count crashes
          crashes=$(find fuzz/afl_findings -name 'id:*' -path '*/crashes/*' 2>/dev/null | wc -l || echo 0)
          echo "Total crashes found: $crashes"
          echo "CRASH_COUNT=$crashes" >> $GITHUB_ENV

      - name: Triage crashes
        if: always()
        run: |
          chmod +x scripts/afl_triage.sh

          for fuzzer_dir in fuzz/afl_findings/fuzzer*; do
            if [[ -d "$fuzzer_dir/crashes" ]]; then
              echo "Triaging $fuzzer_dir/crashes..."
              ./scripts/afl_triage.sh "$fuzzer_dir/crashes" || true
            fi
          done

      - name: Upload crash artifacts
        if: env.CRASH_COUNT > 0
        uses: actions/upload-artifact@v4
        with:
          name: afl-crashes
          path: |
            fuzz/afl_findings/*/crashes/unique/
            fuzz/afl_findings/*/crashes/README.txt
          retention-days: 90

      - name: Upload corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afl-corpus
          path: fuzz/afl_findings/*/queue/
          retention-days: 30

      - name: Upload summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afl-summary
          path: |
            afl_summary.txt
            fuzz/afl_findings/*/fuzzer_stats
            fuzz/afl_findings/*/plot_data
          retention-days: 90

      - name: Generate GitHub summary
        if: always()
        run: |
          echo "# AFL++ Kernel Fuzzing Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Duration:** ${{ github.event.inputs.duration || '24' }} hours" >> $GITHUB_STEP_SUMMARY
          echo "**Instances:** ${{ github.event.inputs.instances || '4' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ -f afl_summary.txt ]]; then
            echo "## Fuzzer Statistics" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat afl_summary.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi

          if [[ ${CRASH_COUNT:-0} -gt 0 ]]; then
            echo "## ⚠️ Crashes Found" >> $GITHUB_STEP_SUMMARY
            echo "Total: **${CRASH_COUNT}** crash(es)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "See artifacts for details." >> $GITHUB_STEP_SUMMARY
          else
            echo "## ✅ No Crashes" >> $GITHUB_STEP_SUMMARY
            echo "Fuzzer completed without finding crashes." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail if crashes found
        if: env.CRASH_COUNT > 0
        run: |
          echo "::error::AFL++ found $CRASH_COUNT crash(es)"
          exit 1

name: Syzkaller-Style Fuzzing

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '3600'
      workers:
        description: 'Number of parallel workers'
        required: false
        default: '4'

jobs:
  syzkaller-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential musl-tools qemu-system-x86 ovmf
          # Pin the toolchain the repo's rust-toolchain.toml declares. build-kcov
          # uses -Z build-std (nightly + rust-src + llvm-tools); build-syz-fuzzer
          # pins +nightly-2025-12-08 via build-isolated.sh. Stable builds neither.
          rustup toolchain install nightly-2025-12-08 --profile default \
            --component rust-src --component llvm-tools-preview
          rustup target add x86_64-unknown-uefi x86_64-unknown-none \
            --toolchain nightly-2025-12-08
          rustup default nightly-2025-12-08

      - name: Build syz-executor kernel
        # build-syz-kcov embeds nilix_syz_executor.elf (the Ring-3 program the
        # host syz-fuzzer drives) instead of build-kcov's deterministic
        # fuzz_runner.elf. The executor reads a fuzz program from the mounted
        # ext3 disk and emits NILIX_SYZ_V2_* markers the fuzzer monitors.
        # build-syz-kcov also builds+embeds the executor, so the standalone
        # build-syz-executor step is no longer needed here.
        run: make build-syz-kcov

      - name: Build host fuzzer
        # build-syz-fuzzer runs build-isolated.sh: it renames the parent
        # userspace/.cargo (whose [unstable] build-std = ["core"] leaks into
        # nested configs and breaks the std host build) and pins nightly.
        run: make build-syz-fuzzer

      - name: Restore fuzzing corpus
        uses: actions/cache/restore@v4
        with:
          # The fuzzer runs from userspace/nilix-syz-fuzzer and uses
          # --corpus-dir ./syz-corpus, so the corpus lives here (matching the
          # upload/stat steps below). The old root-level path cached nothing.
          path: userspace/nilix-syz-fuzzer/syz-corpus
          key: nilix-syz-corpus-${{ github.sha }}
          restore-keys: |
            nilix-syz-corpus-

      - name: Run fuzzer
        run: |
          cd userspace/nilix-syz-fuzzer
          timeout ${{ github.event.inputs.duration || '3600' }} \
            ./target/x86_64-unknown-linux-gnu/release/nilix-syz-fuzzer \
              --kernel ../../esp-syz/kernel.elf \
              --corpus-dir ./syz-corpus \
              --crash-dir ./syz-crashes \
              --timeout ${{ github.event.inputs.duration || '3600' }} \
              --workers ${{ github.event.inputs.workers || '4' }} \
              --program-timeout 30 \
            || true

      - name: Save fuzzing corpus
        uses: actions/cache/save@v4
        if: always()
        with:
          path: userspace/nilix-syz-fuzzer/syz-corpus
          key: nilix-syz-corpus-${{ github.sha }}

      - name: Process crashes
        if: always()
        run: |
          cd userspace/nilix-syz-fuzzer/syz-crashes
          if [ -n "$(ls -A 2>/dev/null)" ]; then
            echo "=== Crashes Found ==="
            for crash in crash-*.bin; do
              if [ -f "$crash" ]; then
                sha256sum "$crash"
                # Generate HMAC-based ID for deduplication
                HMAC=$(sha256sum "$crash" | cut -d' ' -f1 | cut -c1-16)
                echo "Crash ID: NILIX-FUZZ-${HMAC}"
              fi
            done
          else
            echo "No crashes found"
          fi

      - name: Upload crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syzkaller-crashes-${{ github.run_number }}
          path: userspace/nilix-syz-fuzzer/syz-crashes/
          if-no-files-found: ignore

      - name: Upload corpus snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: syzkaller-corpus-${{ github.run_number }}
          path: userspace/nilix-syz-fuzzer/syz-corpus/
          if-no-files-found: ignore

      - name: Report fuzzing statistics
        if: always()
        run: |
          echo "=== Fuzzing Run Complete ==="
          echo "Duration: ${{ github.event.inputs.duration || '3600' }}s"
          echo "Workers: ${{ github.event.inputs.workers || '4' }}"
          if [ -d "userspace/nilix-syz-fuzzer/syz-corpus" ]; then
            CORPUS_SIZE=$(find userspace/nilix-syz-fuzzer/syz-corpus -name "prog-*.bin" | wc -l)
            echo "Corpus entries: $CORPUS_SIZE"
          fi
          if [ -d "userspace/nilix-syz-fuzzer/syz-crashes" ]; then
            CRASH_COUNT=$(find userspace/nilix-syz-fuzzer/syz-crashes -name "crash-*.bin" | wc -l)
            echo "Unique crashes: $CRASH_COUNT"
          fi

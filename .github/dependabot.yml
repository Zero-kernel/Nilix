version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Keep known-incompatible updates from reopening after maintainer review.
    # Remove these entries once the pinned compiler/bootloader APIs are migrated.
    ignore:
      # 0.15.5 implements Step methods removed by nightly-2025-12-08.
      - dependency-name: x86_64
        versions:
          - 0.15.5
      # uefi >= 0.30 requires a dedicated SystemTable/Boot Services migration.
      - dependency-name: uefi
        update-types:
          - version-update:semver-major
    groups:
      kernel-workspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /userspace
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: userspace"
    commit-message:
      prefix: chore(deps)
    groups:
      userspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /userspace/fuzzer
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: fuzzing"
    commit-message:
      prefix: chore(deps)
    groups:
      # RustCrypto crates share a `digest` version and must move as a unit.
      # `crash-triage` builds `Hmac<Sha256>`, so bumping `hmac` and `sha2` in
      # separate pull requests leaves the lockfile carrying two `digest` majors
      # and makes that type unsatisfiable — each pull request is individually
      # uncompilable, which is exactly what happened with hmac 0.13 and
      # sha2 0.11.
      #
      # This group carries no `update-types` filter on purpose. Cargo treats a
      # leading-zero bump such as 0.12 -> 0.13 as incompatible, so Dependabot
      # classifies it as semver-major; a minor+patch filter would exclude
      # precisely the bumps that need grouping.
      rustcrypto:
        patterns:
          - "hmac"
          - "sha2"
          - "sha3"
          - "digest"
          - "crypto-common"
          - "block-buffer"
      # Declared after `rustcrypto` and excluding the same names, so group
      # membership holds regardless of how group precedence is resolved.
      fuzzer-tools-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "hmac"
          - "sha2"
          - "sha3"
          - "digest"
          - "crypto-common"
          - "block-buffer"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
      time: "10:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: fuzzing"
    commit-message:
      prefix: chore(deps)
    groups:
      # Same coupling rule as `/userspace/fuzzer` above. This directory
      # currently declares only `sha2` (optional, behind `qemu-executor`), so
      # today the group holds a single crate; it is declared anyway so adding
      # any sibling RustCrypto crate cannot reintroduce the split-bump trap.
      rustcrypto:
        patterns:
          - "hmac"
          - "sha2"
          - "sha3"
          - "digest"
          - "crypto-common"
          - "block-buffer"
      fuzz-targets-minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "hmac"
          - "sha2"
          - "sha3"
          - "digest"
          - "crypto-common"
          - "block-buffer"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "11:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: tooling/CI"
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"

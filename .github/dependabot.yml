version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore(deps)
    # Keep known-incompatible updates from reopening after maintainer review.
    # Remove these entries once the pinned compiler/bootloader APIs are migrated.
    ignore:
      # 0.15.5 implements Step methods removed by nightly-2025-12-08.
      - dependency-name: x86_64
        versions:
          - 0.15.5
      # uefi >= 0.30 requires a dedicated SystemTable/Boot Services migration.
      - dependency-name: uefi
        update-types:
          - version-update:semver-major
    groups:
      kernel-workspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /userspace
    schedule:
      interval: monthly
      time: "09:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: userspace"
    commit-message:
      prefix: chore(deps)
    groups:
      userspace-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /userspace/fuzzer
    schedule:
      interval: monthly
      time: "10:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: fuzzing"
    commit-message:
      prefix: chore(deps)
    groups:
      fuzzer-tools-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
      time: "10:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: fuzzing"
    commit-message:
      prefix: chore(deps)
    groups:
      fuzz-targets-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "11:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - "area: tooling/CI"
    commit-message:
      prefix: chore(deps)
    groups:
      github-actions:
        patterns:
          - "*"

# Override userspace default target
# Host fuzzer uses standard library, not custom core
[build]
target = "x86_64-unknown-linux-gnu"

# NOTE: Parent userspace/.cargo/config.toml has [unstable] build-std = ["core"]
# which CANNOT be overridden in nested configs. The build-isolated.sh script
# must handle this by temporarily renaming the parent .cargo directory.

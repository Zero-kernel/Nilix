[package]
name = "nilix-syz-fuzzer"
version = "0.1.0"
edition = "2021"

# Host fuzzer runs on Linux, not bare-metal
[lib]
name = "nilix_syz_fuzzer"
path = "src/lib.rs"

[dependencies]
byteorder = "1.5"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.29", features = ["process", "signal"] }
memmap2 = "0.9"
tempfile = "3.0"

[[bin]]
name = "nilix-syz-fuzzer"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

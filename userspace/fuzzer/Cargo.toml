[package]
name = "fuzzer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fuzz-pipeline-smoke"
path = "src/bin/continuous-fuzzer.rs"

[[bin]]
name = "crash-triage"
path = "src/bin/crash-triage.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 2
lto = false
panic = "abort"

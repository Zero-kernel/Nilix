<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" role="img" aria-labelledby="title desc">
  <title id="title">Nilix kernel architecture map / Nilix 内核架构图</title>
  <desc id="desc">A balanced map of the Nilix boot path, syscall boundary, kernel core, services, security plane, and hardware foundation. / Nilix 启动路径、系统调用边界、内核核心、服务层、安全平面与硬件基础的均衡架构图。</desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="security" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b1d18"/>
      <stop offset="0.5" stop-color="#271a22"/>
      <stop offset="1" stop-color="#3b1d18"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7dd3fc"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: url(#canvas); stroke: #26344c; stroke-width: 2; }
      .group { fill: #0f172a; fill-opacity: .76; stroke: #334155; stroke-width: 1.5; }
      .core-group { fill: url(#core); stroke: #4f7cff; stroke-width: 1.8; }
      .security-group { fill: url(#security); stroke: #fb923c; stroke-width: 1.5; }
      .card { fill: #111c2f; stroke: #334155; stroke-width: 1.3; }
      .card-blue { fill: #102542; stroke: #38bdf8; stroke-width: 1.4; }
      .card-orange { fill: #2b211c; stroke: #fb923c; stroke-width: 1.4; }
      .card-green { fill: #102a2a; stroke: #2dd4bf; stroke-width: 1.4; }
      .card-purple { fill: #211d38; stroke: #a78bfa; stroke-width: 1.4; }
      .chip { fill: #211a25; stroke: #fb923c; stroke-width: 1.1; }
      .title { fill: #f8fafc; font: 700 22px Inter, Segoe UI, sans-serif; letter-spacing: 1.6px; }
      .subtitle { fill: #94a3b8; font: 11px Inter, Segoe UI, sans-serif; letter-spacing: .2px; }
      .group-title { fill: #cbd5e1; font: 700 11px Inter, Segoe UI, sans-serif; letter-spacing: 1px; }
      .card-title { fill: #f8fafc; font: 700 13px Inter, Segoe UI, sans-serif; }
      .card-title-small { fill: #f8fafc; font: 700 11px Inter, Segoe UI, sans-serif; }
      .fn { fill: #7dd3fc; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .fn-orange { fill: #fdba74; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .fn-green { fill: #5eead4; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .fn-purple { fill: #c4b5fd; font: 12px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .detail { fill: #cbd5e1; font: 11px Inter, Segoe UI, sans-serif; }
      .muted { fill: #94a3b8; font: 11px Inter, Segoe UI, sans-serif; }
      .arrow { fill: none; stroke: #7dd3fc; stroke-width: 2; marker-end: url(#arrow); }
      .arrow-muted { fill: none; stroke: #64748b; stroke-width: 1.4; marker-end: url(#arrow-muted); }
      .cross { fill: none; stroke: #fb923c; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .trunk { fill: none; stroke: #475569; stroke-width: 1.4; }
      .dot { fill: #7dd3fc; }
      .dot-orange { fill: #fb923c; }
    </style>
  </defs>

  <rect class="canvas" x="8" y="8" width="1264" height="1024" rx="28"/>
  <text class="title" x="48" y="48">NILIX KERNEL MAP / NILIX 内核架构</text>
  <text class="subtitle" x="49" y="70">execution path · ownership boundaries · subsystem composition / 执行路径 · 所有权边界 · 子系统组成</text>
  <text class="subtitle" x="1230" y="48" text-anchor="end">Security &gt; Correctness &gt; Efficiency &gt; Performance / 安全性 &gt; 正确性 &gt; 效率 &gt; 性能</text>

  <!-- Entry row -->
  <rect class="card-orange" x="50" y="92" width="300" height="108" rx="14"/>
  <text class="card-title" x="72" y="122">UEFI BOOT / 启动</text>
  <text class="fn-orange" x="72" y="151">bootloader::efi_main</text>
  <text class="detail" x="72" y="174">ELF · PIE/KASLR · page tables / 页表</text>
  <text class="detail" x="72" y="190">BootInfo* → kernel / 内核</text>

  <rect class="card-blue" x="490" y="92" width="300" height="108" rx="14"/>
  <text class="card-title" x="512" y="122">KERNEL ENTRY / 内核入口</text>
  <text class="fn" x="512" y="151">kernel::_start</text>
  <text class="detail" x="512" y="174">console → IRQ → mm → security / 控制台 → 中断 → 内存 → 安全</text>
  <text class="detail" x="512" y="190">SMP → services → Ring 3 / 服务 → 用户态</text>

  <rect class="card-green" x="930" y="92" width="300" height="108" rx="14"/>
  <text class="card-title" x="952" y="122">USERSPACE / 用户态</text>
  <text class="fn-green" x="952" y="151">shell · syscall_test · musl</text>
  <text class="detail" x="952" y="174">Ring 3 · ELF · POSIX ABI / 用户态 ABI</text>
  <text class="detail" x="952" y="190">SYSCALL / SYSRET</text>

  <path class="arrow" d="M 350 146 L 490 146"/>
  <path class="arrow" d="M 1080 200 L 1080 232"/>

  <!-- Trust boundary -->
  <rect class="group" x="110" y="232" width="1060" height="128" rx="18"/>
  <text class="group-title" x="136" y="255">ENTRY &amp; TRUST BOUNDARY / 入口与信任边界</text>

  <rect class="card" x="135" y="270" width="300" height="68" rx="10"/>
  <text class="card-title-small" x="153" y="296">ARCH ENTRY / 架构入口</text>
  <text class="fn" x="153" y="319">arch::syscall_entry_stub</text>
  <text class="muted" x="153" y="333">SWAPGS · KPTI · user frame / 用户帧</text>

  <rect class="card" x="490" y="270" width="300" height="68" rx="10"/>
  <text class="card-title-small" x="508" y="296">POLICY GATE / 策略门</text>
  <text class="fn-orange" x="508" y="319">seccomp · LSM · CapTable</text>
  <text class="muted" x="508" y="333">deny → audit → errno / 拒绝 → 审计 → 错误码</text>

  <rect class="card" x="845" y="270" width="300" height="68" rx="10"/>
  <text class="card-title-small" x="863" y="296">DISPATCH / 系统调用分派</text>
  <text class="fn" x="863" y="319">kernel_core::syscall_dispatcher</text>
  <text class="muted" x="863" y="333">113 Linux-compatible calls / 113 个兼容系统调用</text>

  <path class="arrow" d="M 435 304 L 490 304"/>
  <path class="arrow" d="M 790 304 L 845 304"/>
  <path class="arrow" d="M 640 360 L 640 405"/>

  <!-- Kernel core -->
  <rect class="core-group" x="165" y="405" width="950" height="190" rx="20"/>
  <text class="group-title" x="195" y="431">KERNEL CORE / kernel_core · HUB / 内核核心枢纽</text>

  <rect class="card-blue" x="195" y="450" width="270" height="112" rx="12"/>
  <text class="card-title" x="215" y="480">PROCESS / 进程与执行</text>
  <text class="fn" x="215" y="507">fork · clone · execve</text>
  <text class="fn" x="215" y="528">exit · signals · ELF</text>
  <text class="detail" x="215" y="550">PCB · COW · user stacks / 用户栈</text>

  <rect class="card-blue" x="505" y="450" width="270" height="112" rx="12"/>
  <text class="card-title" x="525" y="480">NAMESPACES / CGROUPS · 命名空间</text>
  <text class="fn" x="525" y="507">clone · unshare · setns</text>
  <text class="fn" x="525" y="528">cgroup_create · migrate</text>
  <text class="detail" x="525" y="550">PID · mount · net · user / 五类命名空间</text>

  <rect class="card-blue" x="815" y="450" width="270" height="112" rx="12"/>
  <text class="card-title" x="835" y="480">WAIT / TIME / RCU · 等待与时间</text>
  <text class="fn" x="835" y="507">wait · block · wake</text>
  <text class="fn" x="835" y="528">time::on_timer_tick</text>
  <text class="detail" x="835" y="550">deferred work · lifecycle / 延迟工作 · 生命周期</text>

  <!-- Core-to-service trunk -->
  <path class="trunk" d="M 640 595 L 640 615 L 150 615 M 640 615 L 1110 615"/>
  <path class="arrow-muted" d="M 150 615 L 150 635"/>
  <path class="arrow-muted" d="M 390 615 L 390 635"/>
  <path class="arrow-muted" d="M 630 615 L 630 635"/>
  <path class="arrow-muted" d="M 870 615 L 870 635"/>
  <path class="arrow-muted" d="M 1110 615 L 1110 635"/>
  <circle class="dot" cx="640" cy="615" r="4"/>

  <!-- Service plane -->
  <rect class="group" x="25" y="635" width="1230" height="132" rx="18"/>
  <text class="group-title" x="50" y="658">SERVICE PLANE / 内核服务层</text>

  <rect class="card" x="35" y="673" width="230" height="78" rx="11"/>
  <text class="card-title-small" x="52" y="699">MEMORY / mm / 内存</text>
  <text class="fn" x="52" y="722">init_with_bootinfo</text>
  <text class="detail" x="52" y="740">buddy · PTE · COW · cache / 页缓存</text>

  <rect class="card" x="275" y="673" width="230" height="78" rx="11"/>
  <text class="card-title-small" x="292" y="699">SCHEDULER / sched / 调度器</text>
  <text class="fn" x="292" y="722">select_next · reschedule_now</text>
  <text class="detail" x="292" y="740">per-CPU MLFQ · work stealing / 工作窃取</text>

  <rect class="card" x="515" y="673" width="230" height="78" rx="11"/>
  <text class="card-title-small" x="532" y="699">FILESYSTEM / vfs / 文件系统</text>
  <text class="fn" x="532" y="722">vfs_init · openat · mount</text>
  <text class="detail" x="532" y="740">ramfs · ext2 · procfs · devfs</text>

  <rect class="card" x="755" y="673" width="230" height="78" rx="11"/>
  <text class="card-title-small" x="772" y="699">NETWORK / net / 网络</text>
  <text class="fn" x="772" y="722">process_frame · rx_ingress_poll</text>
  <text class="detail" x="772" y="740">ARP · IPv4 · TCP/UDP · firewall / 防火墙</text>

  <rect class="card" x="995" y="673" width="230" height="78" rx="11"/>
  <text class="card-title-small" x="1012" y="699">IPC / 进程间通信</text>
  <text class="fn" x="1012" y="722">ipc::init · pipe · futex</text>
  <text class="detail" x="1012" y="740">PI · queues · signals / 队列 · 信号</text>

  <!-- Cross-cutting security -->
  <path class="cross" d="M 78 365 L 78 805 M 1202 365 L 1202 805"/>
  <rect class="security-group" x="25" y="805" width="1230" height="90" rx="18"/>
  <text class="group-title" x="50" y="828">SECURITY PLANE / 横向安全与治理（虚线 = 横切依赖）</text>

  <rect class="chip" x="55" y="840" width="215" height="38" rx="9"/>
  <text class="card-title-small" x="72" y="864">cap / CapTable · 能力表</text>
  <rect class="chip" x="290" y="840" width="215" height="38" rx="9"/>
  <text class="card-title-small" x="307" y="864">lsm / 40+ hooks · 钩子</text>
  <rect class="chip" x="525" y="840" width="215" height="38" rx="9"/>
  <text class="card-title-small" x="542" y="864">seccomp / pledge · 过滤</text>
  <rect class="chip" x="760" y="840" width="215" height="38" rx="9"/>
  <text class="card-title-small" x="777" y="864">audit / SHA-256-HMAC · 审计</text>
  <rect class="chip" x="995" y="840" width="215" height="38" rx="9"/>
  <text class="card-title-small" x="1012" y="864">W^X · KASLR · KPTI · 加固</text>

  <path class="cross" d="M 165 805 L 165 595 M 385 805 L 385 595 M 605 805 L 605 595 M 825 805 L 825 595 M 1045 805 L 1045 595"/>

  <!-- Foundation -->
  <path class="trunk" d="M 640 895 L 640 915 L 175 915 M 640 915 L 1105 915"/>
  <path class="arrow-muted" d="M 175 915 L 175 935"/>
  <path class="arrow-muted" d="M 485 915 L 485 935"/>
  <path class="arrow-muted" d="M 795 915 L 795 935"/>
  <path class="arrow-muted" d="M 1105 915 L 1105 935"/>
  <circle class="dot-orange" cx="640" cy="915" r="4"/>

  <rect class="group" x="25" y="935" width="1230" height="78" rx="18"/>
  <text class="group-title" x="50" y="958">FOUNDATION &amp; HARDWARE / 基础与硬件</text>

  <rect class="card-purple" x="35" y="968" width="280" height="35" rx="9"/>
  <text class="card-title-small" x="52" y="991">arch · IDT/APIC/SMP/IPI</text>
  <rect class="card-purple" x="325" y="968" width="280" height="35" rx="9"/>
  <text class="card-title-small" x="342" y="991">drivers · virtio · console</text>
  <rect class="card-purple" x="615" y="968" width="280" height="35" rx="9"/>
  <text class="card-title-small" x="632" y="991">block · IOMMU / VT-d</text>
  <rect class="card-purple" x="905" y="968" width="320" height="35" rx="9"/>
  <text class="card-title-small" x="922" y="991">trace · KCOV · livepatch</text>
</svg>

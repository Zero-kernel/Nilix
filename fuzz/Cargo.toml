[package]
name = "nilix-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[lib]
name = "nilix_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3", features = ["derive"] }

# Real kernel code under test. These crates transitively depend on `mm`, whose
# #[global_allocator] would collide with std's in this hosted harness. Enabling
# `mm/host_harness` via the direct `mm` dep below compiles that registration
# out; cargo feature unification then applies it to the single shared `mm` build
# that net/vfs/kernel_core also use, so the whole graph links against std's
# allocator. Only the pure, host-safe parsers/validators are CALLED from the
# targets (fuzz_elf_loader, fuzz_network_packet, fuzz_vfs_path); the remaining
# targets stay self-contained (the subsystems they model are hardware/stateful
# and are not host-callable without a mock harness).
#
# NEW: The host_harness feature also exposes test_harness module with
# BuddyAllocatorHarness and PageTableHarness for fuzz_buddy_allocator and
# fuzz_page_table_ops targets.
mm = { path = "../kernel/mm", features = ["host_harness"] }
net = { path = "../kernel/net" }
vfs = { path = "../kernel/vfs" }
kernel_core = { path = "../kernel/kernel_core" }

# QEMU executor dependencies (only for fuzz_syscall_qemu target)
# These are optional to avoid requiring syzkaller deps for simple cargo-fuzz runs
anyhow = { version = "1.0", optional = true }
tempfile = { version = "3.0", optional = true }
nix = { version = "0.29", features = ["signal"], optional = true }
hex = { version = "0.4", optional = true }
sha2 = { version = "0.10", optional = true }
rand = { version = "0.10", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[features]
default = []
# Enable QEMU executor for fuzz_syscall_qemu target
qemu-executor = ["anyhow", "tempfile", "nix", "hex", "sha2", "rand", "serde", "serde_json"]

# Prevent this from interfering with workspace lints
[workspace]
members = ["."]

[[bin]]
name = "fuzz_syscall"
path = "fuzz_targets/fuzz_syscall.rs"
test = false
doc = false

[[bin]]
name = "fuzz_vfs_path"
path = "fuzz_targets/fuzz_vfs_path.rs"
test = false
doc = false

[[bin]]
name = "fuzz_signal_delivery"
path = "fuzz_targets/fuzz_signal_delivery.rs"
test = false
doc = false

[[bin]]
name = "fuzz_memory_ops"
path = "fuzz_targets/fuzz_memory_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_ipc_message"
path = "fuzz_targets/fuzz_ipc_message.rs"
test = false
doc = false

[[bin]]
name = "fuzz_scheduler"
path = "fuzz_targets/fuzz_scheduler.rs"
test = false
doc = false

[[bin]]
name = "fuzz_network_packet"
path = "fuzz_targets/fuzz_network_packet.rs"
test = false
doc = false

[[bin]]
name = "fuzz_cgroup_ops"
path = "fuzz_targets/fuzz_cgroup_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_elf_loader"
path = "fuzz_targets/fuzz_elf_loader.rs"
test = false
doc = false

[[bin]]
name = "fuzz_futex_ops"
path = "fuzz_targets/fuzz_futex_ops.rs"
test = false
doc = false

[[bin]]
name = "fuzz_buddy_allocator"
path = "fuzz_targets/fuzz_buddy_allocator.rs"
test = false
doc = false

[[bin]]
name = "fuzz_page_table_ops"
path = "fuzz_targets/fuzz_page_table_ops.rs"

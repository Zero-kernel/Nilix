[package]
name = "coverage"
version = "0.1.0"
edition = "2021"

[dependencies]
spin = "0.9"
cpu_local = { path = "../cpu_local" }

[dev-dependencies]
cpu_local = { path = "../cpu_local", features = ["host_harness"] }

[lib]
name = "coverage"
path = "lib.rs"

[features]
default = []
# Enable KCOV instrumentation (compile-time flag)
kcov = []

[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[features]
# host_harness: compile `mm` WITHOUT its #[global_allocator] registration so the
# crate (and everything that transitively depends on it) can link into a hosted
# std binary — the cargo-fuzz harness. OFF for the kernel build; see the
# ALLOCATOR static in memory.rs.
host_harness = []

[dependencies]
drivers = { path = "../drivers" }
cpu_local = { path = "../cpu_local" }
tlb_ops = { path = "../tlb_ops" }
x86_64 = "0.15"
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
bit-vec = { version = "0.6", default-features = false }
klog = { path = "../klog" }
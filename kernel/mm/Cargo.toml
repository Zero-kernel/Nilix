[package]
name = "mm"
version = "0.1.0"
edition = "2021"

[lib]
path = "lib.rs"

[features]
# host_harness: compile `mm` WITHOUT its #[global_allocator] registration,
# make CPU-local lookup safe for an ordinary hosted process with no LAPIC MMIO
# mapping, and lazily publish the admission ledger when a dependency-only test
# binary has no kernel boot publication hook. The feature is OFF for the kernel
# build; see the ALLOCATOR static in memory.rs and cpu_local::current_cpu_id().
host_harness = ["cpu_local/host_harness"]

# fuzz_runner: enable KCOV instrumentation and raise boot heap budget to accommodate
# the coverage infrastructure overhead. This feature is propagated from the kernel crate.
fuzz_runner = []

# syz_executor: same KCOV instrumentation + raised boot heap budget as fuzz_runner,
# propagated from the kernel crate's syz_executor feature. The syz guest executor is a
# KCOV Ring-3 program with equivalent boot footprint; it shares the raised budget.
syz_executor = []

[dependencies]
drivers = { path = "../drivers" }
cpu_local = { path = "../cpu_local" }
tlb_ops = { path = "../tlb_ops" }
x86_64 = "0.15"
spin = "0.9"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
klog = { path = "../klog" }

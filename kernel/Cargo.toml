[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

# 移除内核内部 workspace 配置，避免与顶层 workspace 冲突

[features]
default = []
# Enable interactive shell instead of hello test program
shell = []
# Enable syscall test program
syscall_test = []
# Enable musl libc test program
musl_test = []
# Enable clone syscall test program
clone_test = []
# Enable the bounded monthly Ring-3 stress workload
stress_runner = []
# Enable KCOV fuzz runner test program (Phase 2 completion)
fuzz_runner = ["mm/fuzz_runner", "kcov"]
# Enable the syzkaller-style guest executor as the Ring-3 boot program. Unlike
# fuzz_runner (a deterministic self-contained test), the syz executor reads a
# fuzz program from the mounted ext3 disk (/mnt/test/syz-program.bin) and emits
# NILIX_SYZ_V2_* markers for the host syz-fuzzer. Mutually exclusive with
# fuzz_runner at the USER_ELF_ALIGNED selection (build one or the other).
syz_executor = ["mm/syz_executor", "kcov"]
# Enable kernel code coverage instrumentation for fuzzing
kcov = ["coverage/kcov", "kernel_core/kcov"]
# Hosted unit-test harness for the top-level kernel package.  This is a
# test-only dependency mode: it routes MM and CPU-local state through their
# host-safe implementations while bare-metal builds retain the production
# allocator and topology paths.
host_harness = ["mm/host_harness", "kernel_core/host_harness"]

[dependencies]
spin = "0.12"
lazy_static = { version = "1.4", features = ["spin_no_std"] }
x86_64 = "=0.15.4"
uart_16550 = "0.6"
linked_list_allocator = "0.10"
arch = { path = "arch" }
mm = { path = "mm" }
sched = { path = "sched" }
ipc = { path = "ipc" }
drivers = { path = "drivers" }
kernel_core = { path = "kernel_core" }
security = { path = "security" }
vfs = { path = "vfs" }
audit = { path = "audit" }
cap = { path = "cap" }
lsm = { path = "lsm", features = ["lsm"] }
seccomp = { path = "seccomp" }
block = { path = "block" }
net = { path = "net" }
iommu = { path = "iommu" }
trace = { path = "trace" }
compliance = { path = "compliance" }
livepatch = { path = "livepatch" }
klog = { path = "klog" }
sync_safe = { path = "sync_safe" }
coverage = { path = "coverage", optional = true }

# 暂时移除 crossbeam-queue，或确保正确配置
# crossbeam-queue = { version = "0.3", default-features = false, features = ["alloc"] }

[profile.release]
panic = "abort"
lto = true
opt-level = 3
